[package]
publish = false
name = "application-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
document-core = { path = "../document-core" }
font-boundary = { path = "../font-boundary" }
layout-core = { path = "../layout-core" }
serde = { version = "1.0.219", features = ["derive"] }
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }
unicode-properties = { version = "=0.1.4", default-features = false, features = ["general-category"] }
icu_properties = "=2.3.0"

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
serde_json = "1.0.143"
zip = { version = "=8.6.0", default-features = false }

[lints]
workspace = true
