[package]
publish = false
name = "document-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
raster-capacity = { path = "../raster-capacity" }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "tiff"] }
tiff = "=0.11.3"
getrandom = "=0.4.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }
zip = { version = "=8.6.0", default-features = false }

[target.'cfg(windows)'.dependencies]
publisher-windows-atomic-file = { path = "../windows-atomic-file" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }

[lints]
workspace = true
